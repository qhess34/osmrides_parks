name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deux étapes séparées (modèle officiel de GitHub) : dans une seule, la publication ne trouvait plus le site préparé (26/11).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assembler le site (fichiers du jeu uniquement)
        run: |
          mkdir _site
          cp -r *.html *.css *.webmanifest sw.js lieux icons img _site/
          python3 tools/make_sw.py _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
